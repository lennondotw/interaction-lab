# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Lint, typecheck, and test

on:
  # `'*'` does not match branch names containing a slash, so every `chore/…`
  # branch was relying on the pull_request trigger instead — and that one only
  # fired for PRs based on main. A stacked PR sits on the branch below it, so it
  # got no run at all until the stack merged far enough to re-target it. `'**'`
  # matches slashes; the unfiltered pull_request matches any base.
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js with corepack
        uses: ./.github/actions/setup-node

      - name: Setup cache
        uses: ./.github/actions/setup-cache
        with:
          restore-key-prefix: 'lint'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `:packages` fans out over the workspace; `:root` covers the files that
      # belong to no package — oxfmt.config.ts and the rest of
      # tsconfig.node.json. Without both, root-level config is never typechecked.
      - name: Build & typecheck (packages)
        run: pnpm -w --no-bail run tsc:build:packages

      - name: Build & typecheck (root)
        run: pnpm -w --no-bail run tsc:build:root

      # oxlint scans the whole repo in one pass, so there is no per-package
      # variant to run. Type-aware is a superset of plain `lint`, so only this
      # one is worth CI time.
      - name: Lint (type-aware)
        run: pnpm -w --no-bail run lint:type-aware

      - name: Check formatting
        run: pnpm -w --no-bail run format:check

      - name: Check package.json field order
        run: pnpm -w --no-bail run sort-package-json:check

  test:
    runs-on: ubuntu-latest
    name: Run tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js with corepack
        uses: ./.github/actions/setup-node

      - name: Setup cache
        uses: ./.github/actions/setup-cache
        with:
          restore-key-prefix: 'test'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & typecheck
        run: pnpm -w run tsc:build:packages

      - name: Run tests
        run: pnpm -w run test:packages

  build-storybook:
    runs-on: ubuntu-latest
    name: Build storybook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js with corepack
        uses: ./.github/actions/setup-node

      - name: Setup cache
        uses: ./.github/actions/setup-cache
        with:
          restore-key-prefix: 'build-storybook'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm run tsc:build:upstream
        working-directory: lab

      - name: Build storybook
        run: pnpm run build
        working-directory: lab

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: |
            lab/storybook-static/
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    name: Deploy Storybook to Workers
    needs: [lint, test, build-storybook]
    if: github.event_name == 'push'
    permissions:
      contents: read
    concurrency:
      group: cloudflare-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check branch is still current
        id: current
        env:
          BRANCH_REF: ${{ github.ref }}
        run: |
          remote_sha=$(git ls-remote origin "$BRANCH_REF" | cut -f1)
          echo "deploy=$([[ "$remote_sha" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js with corepack
        if: steps.current.outputs.deploy == 'true'
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        if: steps.current.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download verified Storybook build
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: lab/storybook-static

      - name: Deploy production or upload a protected preview
        if: steps.current.outputs.deploy == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            pnpm exec wrangler deploy --message "$GITHUB_SHA"
            deployment_url='https://lab.lennon.sh'
          else
            branch_hash=$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -c1-12)
            preview_alias="branch-$branch_hash"
            pnpm exec wrangler versions upload --preview-alias "$preview_alias" --message "$GITHUB_SHA"
            deployment_url="https://$preview_alias-interaction-lab.lennondotw.workers.dev"
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf '### Storybook deployment\n\nCommit: %s\n\n[Open Storybook](%s)\n' "$GITHUB_SHA" "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
